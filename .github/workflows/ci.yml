name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-test-build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: advisor_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/advisor_platform
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/advisor_platform_test
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      PLATFORM_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Create scratch test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE advisor_platform_test'

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm --filter @workspace/web run build && pnpm --filter @workspace/api run build
